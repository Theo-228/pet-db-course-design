server:
  port: ${PETOS_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: petos
  datasource:
    url: ${PETOS_DB_URL:jdbc:postgresql://localhost:5432/petos}
    username: ${PETOS_DB_USER:postgres}
    password: ${PETOS_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
